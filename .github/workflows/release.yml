name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-server:
    name: Build server (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
            cli: nthttp
            gui: nthttp-gui
            cross: false
            include_gui: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            archive: tar.gz
            cli: nthttp
            gui: nthttp-gui
            # cross docker-based (Debian buster) → binario compatible con
            # Raspbian 12 / Debian 12 (glibc 2.28+). GUI omitida en este
            # build: cross-compilar eframe+wgpu+wayland+x11 para arm64
            # requiere pre-instalar las libs :arm64 y no aporta al uso
            # tipico del Pi (headless). Los usuarios que quieran GUI en
            # RPi pueden `cargo install` desde fuente.
            cross: true
            include_gui: false
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            label: linux-armhf
            archive: tar.gz
            cli: nthttp
            gui: nthttp-gui
            # ARMv6 hardware-float: cubre Raspberry Pi OS 32-bit en TODOS
            # los modelos (Pi 1, Zero, 2, 3, 4, 5 en modo 32-bit). El OS
            # oficial targetea esta ISA. Solo CLI (mismo criterio que arm64).
            cross: true
            include_gui: false
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive: tar.gz
            cli: nthttp
            gui: nthttp-gui
            cross: false
            include_gui: true
          # NOTA: macos-13 (Intel Mac) runners en GitHub Actions tienen colas
          # de espera muy largas (10-30+ min). Para usuarios de Mac Intel,
          # el binario arm64 corre sin problema bajo Rosetta. Si en algun
          # futuro release quieres binario nativo Intel, anade aqui:
          #   - os: macos-13
          #     target: x86_64-apple-darwin
          #     label: macos-x86_64
          #     archive: tar.gz
          #     cli: nthttp
          #     gui: nthttp-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
            cli: nthttp.exe
            gui: nthttp-gui.exe
            cross: false
            include_gui: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (release, cargo)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Build (release, cross)
        if: matrix.cross
        shell: bash
        run: |
          # Cross busca Cargo.toml en el pwd; el default `working-directory: server`
          # ya nos coloca ahi. --bin nthttp para arm64: sin GUI (ver comentario en
          # el matrix).
          if [ "${{ matrix.include_gui }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bins
          else
            cross build --release --target ${{ matrix.target }} --bin nthttp
          fi

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p ../dist/msx-net-transfer-${{ matrix.label }}
          cp target/${{ matrix.target }}/release/${{ matrix.cli }} ../dist/msx-net-transfer-${{ matrix.label }}/
          if [ "${{ matrix.include_gui }}" = "true" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.gui }} ../dist/msx-net-transfer-${{ matrix.label }}/
          fi
          cp ../README.md ../dist/msx-net-transfer-${{ matrix.label }}/
          cp ../LICENSE   ../dist/msx-net-transfer-${{ matrix.label }}/
          cp ../client/nt.com     ../dist/msx-net-transfer-${{ matrix.label }}/NT.COM
          cp ../server-msx/nts.com ../dist/msx-net-transfer-${{ matrix.label }}/NTS.COM

      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd ../dist
          tar -czf msx-net-transfer-${{ matrix.label }}.tar.gz msx-net-transfer-${{ matrix.label }}/

      - name: Pack (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd ../dist
          Compress-Archive -Path msx-net-transfer-${{ matrix.label }} -DestinationPath msx-net-transfer-${{ matrix.label }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msx-net-transfer-${{ matrix.label }}
          path: dist/msx-net-transfer-${{ matrix.label }}.*
          retention-days: 7

  release:
    name: Create release
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lR dist/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            **MSX Net Transfer** — share files from your PC to a real MSX over the network.

            ## What's in this release

            - **Server binaries** (`nthttp` CLI + `nthttp-gui` desktop GUI, salvo Raspberry Pi):
              - `msx-net-transfer-windows-x86_64.zip`
              - `msx-net-transfer-linux-x86_64.tar.gz`
              - `msx-net-transfer-linux-arm64.tar.gz` (Raspberry Pi 64-bit / Raspbian 12+ — CLI only)
              - `msx-net-transfer-linux-armhf.tar.gz` (Raspberry Pi 32-bit incl. Pi 1 / Zero — CLI only)
              - `msx-net-transfer-macos-arm64.tar.gz` (Apple Silicon)
            - **MSX client** `NT.COM` is included inside each archive (it's the same binary on every platform).

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation and usage instructions.
          files: dist/*
          draft: false
          prerelease: false
